pluginManagement {
    repositories {
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google {
            content {
                includeGroup('com.android.tools.build')
            }
        }
        mavenCentral()
    }
}

rootProject.name = 'soloader-android-repro'
include ':app'
